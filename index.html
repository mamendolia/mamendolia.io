const bootEl = document.getElementById('boot');

function runBoot() {
  bootLines.forEach((line, i) => {
    setTimeout(() => {
      if (line.type === 'progress') {
        const wrap = document.createElement('div');
        wrap.className = 'boot-line';
        wrap.innerHTML = `  Checking system integrity... <span class="progress-bar"><span class="progress-fill" id="pfill"></span></span>`;
        bootEl.appendChild(wrap);
        setTimeout(() => wrap.classList.add('show'), 10);
        let p = 0;
        const iv = setInterval(() => {
          p += Math.random() * 12;
          if (p >= 100) { p = 100; clearInterval(iv); }
          const pf = document.getElementById('pfill');
          if (pf) pf.style.width = p + '%';
        }, 60);
        return;
      }
      const div = document.createElement('div');
      div.className = 'boot-line' + (line.cls ? ' ' + line.cls : '');
      if (line.raw) div.innerHTML = line.text;
      else div.textContent = line.text;
      setTimeout(() => div.classList.add('show'), 10);
      bootEl.appendChild(div);
      bootEl.scrollTop = bootEl.scrollHeight;
      if (i === bootLines.length - 1) setTimeout(launchTerminal, 900);
    }, line.delay);
  });
}

function launchTerminal() {
  bootEl.style.transition = 'opacity 0.6s';
  bootEl.style.opacity = '0';
  setTimeout(() => {
    bootEl.classList.add('hidden');
    document.getElementById('terminal').classList.add('visible');
    document.getElementById('input-bar').style.display = 'flex';
    printBanner();
    setTimeout(focusInput, 300);
  }, 650);
}

//  TERMINAL ENGINE

const terminal  = document.getElementById('terminal');
const liveInput = document.getElementById('live-input');
let history = [], histIdx = -1;

function focusInput() { liveInput.focus(); }
document.addEventListener('click', focusInput);

liveInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const cmd = liveInput.value.trim();
    echoCommand(cmd);
    processCommand(cmd);
    if (cmd) { history.unshift(cmd); histIdx = -1; }
    liveInput.value = '';
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (histIdx < history.length - 1) liveInput.value = history[++histIdx];
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    histIdx > 0 ? liveInput.value = history[--histIdx] : (histIdx = -1, liveInput.value = '');
  } else if (e.key === 'Tab') {
    e.preventDefault();
    const cur = liveInput.value.trim();
    const all = ['help','whoami','skills','certs','ls','projects','method','contact','clear','matrix','hack','sudo','uname','neofetch','ping','history','cat','exit','banner'];
    const m = all.find(c => c.startsWith(cur) && c !== cur);
    if (m) liveInput.value = m;
  } else if (e.key === 'l' && e.ctrlKey) {
    e.preventDefault(); terminal.innerHTML = '';
  }
});

function scrollBottom() { setTimeout(() => terminal.scrollTop = terminal.scrollHeight, 50); }

function print(html, cls = '') {
  const d = document.createElement('div');
  d.className = 'output ' + cls;
  d.innerHTML = html;
  terminal.appendChild(d);
  scrollBottom();
  return d;
}

function esc(t) {
  return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function printBlank() { print('&nbsp;'); }

function echoCommand(cmd) {
  const d = document.createElement('div');
  d.className = 'output';
  d.innerHTML = `<span class="prompt-user glow">root</span><span class="prompt-sep">@</span><span class="prompt-user glow">mamendolia</span><span class="prompt-sep">:</span><span class="prompt-path">~</span><span style="color:#ff4444;">#</span>&nbsp;<span style="color:var(--green)">${esc(cmd)}</span>`;
  terminal.appendChild(d);
  scrollBottom();
}

function processCommand(raw) {
  if (!raw) return;
  const parts = raw.split(' '), base = parts[0].toLowerCase();
  switch (base) {
    case 'help':     cmdHelp();        break;
    case 'whoami':   cmdWhoami();      break;
    case 'skills':   cmdSkills();      break;
    case 'certs':    cmdCerts();       break;
    case 'ls':       cmdLs(parts);     break;
    case 'projects': cmdProjects();    break;
    case 'method':   cmdMethod();      break;
    case 'contact':  cmdContact();     break;
    case 'clear':    terminal.innerHTML = ''; printBanner(true); break;
    case 'matrix':   cmdMatrix();      break;
    case 'hack':     cmdHack();        break;
    case 'sudo':     cmdSudo(raw);     break;
    case 'uname':    cmdUname();       break;
    case 'neofetch': cmdNeofetch();    break;
    case 'ping':     cmdPing(parts);   break;
    case 'history':  cmdHistoryCmd();  break;
    case 'cat':      cmdCat(parts);    break;
    case 'exit':     cmdExit();        break;
    case 'banner':   printBanner();    break;
    default:
      print(`<span class="error-line">bash: ${esc(base)}: command not found. Digita <span style="color:var(--green)">help</span> per i comandi.</span>`);
      if (Math.random() > 0.5) {
        setTimeout(() => print(`<span style="color:#111;font-size:11px;user-select:text">// pss... cat flag.txt</span>`), 1200);
      }
  }
  printBlank();
}

function cmdMatrix() {
  const canvas = document.getElementById('matrix-canvas');
  canvas.style.display = 'block';
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  const ctx = canvas.getContext('2d');
  const cols = Math.floor(canvas.width / 16);
  const drops = Array(cols).fill(1);
  const chars = 'アイウエオカキクケコ0123456789ABCDEF><{}[]'.split('');
  print(`<span class="info-blue">Entering the Matrix... premi un tasto per uscire.</span>`);
  const iv = setInterval(() => {
    ctx.fillStyle = 'rgba(0,0,0,0.05)'; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = '#00ff41'; ctx.font = '14px Share Tech Mono';
    drops.forEach((y,i) => {
      ctx.fillText(chars[Math.floor(Math.random()*chars.length)], i*16, y*16);
      if (y*16 > canvas.height && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    });
  }, 50);
  const stop = () => {
    clearInterval(iv); ctx.clearRect(0,0,canvas.width,canvas.height);
    canvas.style.display = 'none'; canvas.style.pointerEvents = 'none';
    document.removeEventListener('keydown', stop);
    printBlank(); print(`<span class="info-blue">Welcome back to reality, Matteo.</span>`);
  };
  setTimeout(() => {
    document.addEventListener('keydown', stop, { once: true });
    canvas.style.pointerEvents = 'all';
    canvas.addEventListener('click', stop, { once: true });
  }, 500);
}
