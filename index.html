<head>

<title>root@yourname:~#</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap');

  :root {
    --green: #00ff41;
    --green-dim: #00aa2a;
    --green-glow: #00ff4180;
    --green-dark: #003b0f;
    --bg: #0a0a0a;
    --scanline: rgba(0,0,0,0.15);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    color: var(--green);
    font-family: 'Share Tech Mono', monospace;
    overflow: hidden;
  }

  /* CRT wrapper */
  #crt {
    width: 100vw; height: 100vh;
    position: relative;
    overflow: hidden;
  }

  /* Scanlines */
  #crt::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 2px,
      var(--scanline) 2px,
      var(--scanline) 4px
    );
    pointer-events: none;
    z-index: 100;
    animation: scanroll 8s linear infinite;
  }

  /* Screen flicker */
  #crt::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, rgba(0,255,65,0.03) 0%, rgba(0,0,0,0.4) 100%);
    pointer-events: none;
    z-index: 99;
    animation: flicker 0.15s infinite;
  }

  @keyframes scanroll {
    0%   { background-position: 0 0; }
    100% { background-position: 0 100vh; }
  }

  @keyframes flicker {
    0%,100% { opacity: 1; }
    92% { opacity: 1; }
    93% { opacity: 0.92; }
    94% { opacity: 1; }
    96% { opacity: 0.97; }
  }

  /* Boot screen */
  #boot {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 200;
    padding: 20px 30px;
    font-family: 'VT323', monospace;
    font-size: 18px;
    line-height: 1.5;
    overflow: hidden;
  }

  #boot.hidden { display: none; }

  .boot-line { opacity: 0; }
  .boot-line.show { opacity: 1; }
  .boot-progress { color: var(--green-dim); }
  .boot-ok { color: #00ff41; }
  .boot-warn { color: #ffaa00; }

  /* Progress bar */
  .progress-bar {
    display: inline-block;
    width: 200px;
    background: var(--green-dark);
    height: 12px;
    vertical-align: middle;
    position: relative;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--green);
    width: 0%;
    transition: width 0.05s;
    box-shadow: 0 0 8px var(--green);
  }

  /* Terminal */
  #terminal {
    width: 100%;
    height: 100vh;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 15px 20px 100px 20px;
    scroll-behavior: smooth;
    opacity: 0;
    transition: opacity 0.5s;
  }
  #terminal.visible { opacity: 1; }

  #terminal::-webkit-scrollbar { width: 6px; }
  #terminal::-webkit-scrollbar-track { background: var(--bg); }
  #terminal::-webkit-scrollbar-thumb { background: var(--green-dim); }

  .output { margin-bottom: 2px; }

  .prompt-line {
    display: flex;
    align-items: center;
    gap: 0;
    flex-wrap: nowrap;
  }

  .prompt-user { color: #00ff41; }
  .prompt-sep   { color: #00aa2a; }
  .prompt-path  { color: #00ccff; }
  .prompt-hash  { color: #ff4444; }
  .prompt-input {
    background: transparent;
    border: none;
    outline: none;
    color: var(--green);
    font-family: 'Share Tech Mono', monospace;
    font-size: 15px;
    flex: 1;
    caret-color: var(--green);
  }

  /* Glow text */
  .glow {
    text-shadow: 0 0 8px var(--green), 0 0 20px var(--green-glow);
  }
  .glow-dim {
    text-shadow: 0 0 5px var(--green-glow);
  }

  /* ASCII art */
  .ascii {
    font-family: 'VT323', monospace;
    font-size: 14px;
    line-height: 1.15;
    color: var(--green);
    text-shadow: 0 0 10px var(--green);
    white-space: pre;
  }

  .section-header {
    color: var(--green);
    border-bottom: 1px solid var(--green-dim);
    margin: 6px 0 4px 0;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 3px;
    text-shadow: 0 0 8px var(--green);
  }

  .info-key   { color: var(--green-dim); min-width: 140px; display: inline-block; }
  .info-val   { color: var(--green); }
  .info-line  { margin: 2px 0; font-size: 14px; }

  .skill-bar-wrap { display: flex; align-items: center; gap: 10px; margin: 3px 0; }
  .skill-name { color: var(--green-dim); width: 180px; font-size: 13px; }
  .skill-bar  {
    height: 10px; background: var(--green-dark);
    position: relative; overflow: hidden;
    box-shadow: inset 0 0 4px rgba(0,0,0,0.5);
  }
  .skill-fill {
    height: 100%; background: var(--green);
    box-shadow: 0 0 6px var(--green);
    width: 0%;
    transition: width 0.8s ease;
  }
  .skill-pct { color: var(--green-dim); font-size: 12px; width: 35px; }

  .project-card {
    border: 1px solid var(--green-dim);
    padding: 8px 12px;
    margin: 6px 0;
    position: relative;
    font-size: 13px;
  }
  .project-card::before {
    content: '▶';
    color: var(--green);
    margin-right: 8px;
  }
  .project-title { color: var(--green); font-size: 14px; font-weight: bold; }
  .project-desc  { color: var(--green-dim); margin-top: 2px; }
  .project-tags  { margin-top: 4px; }
  .tag {
    display: inline-block;
    border: 1px solid var(--green-dim);
    color: var(--green-dim);
    font-size: 11px;
    padding: 1px 6px;
    margin-right: 4px;
  }

  .exp-entry { margin: 8px 0; font-size: 13px; }
  .exp-title { color: var(--green); }
  .exp-company { color: #00ccff; }
  .exp-date { color: var(--green-dim); font-size: 12px; }
  .exp-desc { color: var(--green-dim); padding-left: 20px; margin-top: 2px; }

  .contact-line { display: flex; align-items: center; gap: 12px; margin: 5px 0; font-size: 14px; }
  .contact-icon { color: var(--green); width: 20px; text-align: center; }
  .contact-label { color: var(--green-dim); width: 80px; }
  .contact-val { color: var(--green); }
  .contact-val a { color: var(--green); text-decoration: none; }
  .contact-val a:hover { text-shadow: 0 0 8px var(--green); text-decoration: underline; }

  .error-line { color: #ff4444; }
  .warn-line  { color: #ffaa00; }
  .info-blue  { color: #00ccff; }

  .cursor-blink {
    display: inline-block;
    width: 9px; height: 16px;
    background: var(--green);
    animation: blink 1s step-end infinite;
    vertical-align: middle;
    margin-left: 1px;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* Matrix rain overlay */
  #matrix-canvas {
    position: fixed;
    inset: 0;
    z-index: 150;
    display: none;
    pointer-events: none;
  }

  /* Glitch animation */
  @keyframes glitch {
    0%   { transform: translateX(0);  clip-path: inset(0 0 100% 0); }
    10%  { transform: translateX(-3px); clip-path: inset(10% 0 60% 0); }
    20%  { transform: translateX(3px);  clip-path: inset(40% 0 30% 0); }
    30%  { transform: translateX(-2px); clip-path: inset(70% 0 10% 0); }
    40%  { transform: translateX(0);   clip-path: inset(0 0 100% 0); }
    100% { transform: translateX(0);   clip-path: inset(0 0 100% 0); }
  }

  .typing { overflow: hidden; white-space: nowrap; }

  /* Help table */
  .help-row { display: flex; gap: 0; margin: 2px 0; font-size: 13px; }
  .help-cmd  { color: var(--green); width: 130px; }
  .help-desc { color: var(--green-dim); }

  pre { font-family: 'Share Tech Mono', monospace; font-size: 13px; }

  .divider { color: var(--green-dim); margin: 4px 0; font-size: 13px; }

  /* Sticky input bar */
  #input-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: rgba(10,10,10,0.95);
    border-top: 1px solid var(--green-dim);
    padding: 10px 20px;
    display: flex;
    align-items: center;
    z-index: 50;
    backdrop-filter: blur(4px);
  }
  #input-bar .prompt-user { font-size: 15px; }
  #live-input {
    background: transparent;
    border: none;
    outline: none;
    color: var(--green);
    font-family: 'Share Tech Mono', monospace;
    font-size: 15px;
    flex: 1;
    caret-color: var(--green);
    text-shadow: 0 0 6px var(--green-glow);
  }
</style>

// ═══════════════════════════════════════════════

const bootLines = [

  { text: '  [  OK  ] Started OpenSSH daemon', delay: 1130, cls: 'boot-line boot-ok', raw: true, prefix: '' },
  { text: '  [  OK  ] Started Tor hidden service', delay: 1200, cls: 'boot-line boot-ok', raw: true },
  { text: '  [  OK  ] Mounted encrypted volumes', delay: 1270, cls: 'boot-line boot-ok', raw: true },

  { text: '', delay: 2600 },
];

const bootEl = document.getElementById('boot');

function runBoot() {
  let progressEl = null;
  bootLines.forEach((line, i) => {
    setTimeout(() => {
      if (line.type === 'progress') {
        const wrap = document.createElement('div');
        wrap.className = 'boot-line boot-progress';
        wrap.innerHTML = `  Running integrity checks... <span class="progress-bar"><span class="progress-fill" id="pfill"></span></span>`;
        bootEl.appendChild(wrap);
        progressEl = document.getElementById('pfill');
        let p = 0;
        const iv = setInterval(() => {
          p += Math.random() * 12;
          if (p >= 100) { p = 100; clearInterval(iv); }
          if (progressEl) progressEl.style.width = p + '%';
        }, 60);
        return;
      }
      const div = document.createElement('div');
      if (line.cls) div.className = line.cls;
      if (line.raw) div.innerHTML = line.text;
      else div.textContent = line.text;
      setTimeout(() => div.classList.add('show'), 10);
      bootEl.appendChild(div);
      bootEl.scrollTop = bootEl.scrollHeight;

      // Last boot line — transition to terminal
      if (i === bootLines.length - 1) {
        setTimeout(launchTerminal, 900);
      }
    }, line.delay);
  });
}

function launchTerminal() {
  bootEl.style.transition = 'opacity 0.6s';
  bootEl.style.opacity = '0';
  setTimeout(() => {
    bootEl.classList.add('hidden');
    const term = document.getElementById('terminal');
    const bar  = document.getElementById('input-bar');
    document.getElementById('hostname-bar').textContent = CONFIG.hostname;
    term.classList.add('visible');
    bar.style.display = 'flex';
    printBanner();
    setTimeout(focusInput, 300);
  }, 650);
}

// ═══════════════════════════════════════════════
//  TERMINAL ENGINE
// ═══════════════════════════════════════════════
const terminal = document.getElementById('terminal');
const liveInput = document.getElementById('live-input');
let cmdHistory = [];
let histIdx = -1;

function focusInput() { liveInput.focus(); }
document.addEventListener('click', focusInput);

liveInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const cmd = liveInput.value.trim();
    echoCommand(cmd);
    processCommand(cmd);
    if (cmd) { cmdHistory.unshift(cmd); histIdx = -1; }
    liveInput.value = '';
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (histIdx < cmdHistory.length - 1) { histIdx++; liveInput.value = cmdHistory[histIdx]; }
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (histIdx > 0) { histIdx--; liveInput.value = cmdHistory[histIdx]; }
    else { histIdx = -1; liveInput.value = ''; }
  } else if (e.key === 'Tab') {
    e.preventDefault();
    const cur = liveInput.value.trim();
    const cmds = ['help','whoami','skills','ls','projects','contact','clear','matrix','hack','sudo','uname','neofetch','ping','history','cat','exit'];
    const match = cmds.find(c => c.startsWith(cur) && c !== cur);
    if (match) liveInput.value = match;
  } else if (e.key === 'l' && e.ctrlKey) {
    e.preventDefault();
    terminal.innerHTML = '';
  }
});

function scrollBottom() {
  setTimeout(() => terminal.scrollTop = terminal.scrollHeight, 50);
}

function print(html, cls = '') {
  const d = document.createElement('div');
  d.className = 'output ' + cls;
  d.innerHTML = html;
  terminal.appendChild(d);
  scrollBottom();
  return d;
}

function printRaw(text, cls = '') {
  return print(escHtml(text), cls);
}

function escHtml(t) {
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function printBlank() { print('&nbsp;'); }

function echoCommand(cmd) {
  const d = document.createElement('div');
  d.className = 'output prompt-line';
  d.innerHTML = `<span class="prompt-user glow">root</span><span class="prompt-sep">@</span><span class="prompt-user glow">${CONFIG.hostname}</span><span class="prompt-sep">:</span><span class="prompt-path">~</span><span style="color:#ff4444;">#</span>&nbsp;<span style="color:var(--green)">${escHtml(cmd)}</span>`;
  terminal.appendChild(d);
  scrollBottom();
}

// ═══════════════════════════════════════════════
//  COMMANDS
// ═══════════════════════════════════════════════
function processCommand(cmd) {
  if (!cmd) return;
  const parts = cmd.split(' ');
  const base  = parts[0].toLowerCase();

  switch(base) {
    case 'help':      cmdHelp(); break;
    case 'whoami':    cmdWhoami(); break;
    case 'skills':    cmdSkills(); break;
    case 'ls':        cmdLs(parts); break;
    case 'projects':  cmdProjects(); break;
    case 'contact':   cmdContact(); break;
    case 'clear':     terminal.innerHTML = ''; printBanner(true); break;
    case 'matrix':    cmdMatrix(); break;
    case 'hack':      cmdHack(); break;
    case 'sudo':      cmdSudo(cmd); break;
    case 'uname':     cmdUname(); break;
    case 'neofetch':  cmdNeofetch(); break;
    case 'ping':      cmdPing(parts); break;
    case 'history':   cmdHistory2(); break;
    case 'cat':       cmdCat(parts); break;
    case 'exit':      cmdExit(); break;
    case 'banner':    printBanner(); break;
    default:
      print(`<span class="error-line">bash: ${escHtml(base)}: command not found. Type <span style="color:var(--green)">help</span> for available commands.</span>`);
  }
  printBlank();
}

function cmdHelp() {
  print(`<span class="section-header">═══ AVAILABLE COMMANDS ═══════════════════════════</span>`);
  printBlank();
  const cmds = [
    ['whoami',       'Chi sono — bio e informazioni personali'],
    ['skills',       'Competenze tecniche e livelli'],
    ['ls [-la]',     'Esperienze lavorative (simula directory listing)'],

    ['ping <host>',  'Ping verso un host'],

    ['history',      'Cronologia comandi'],
    ['matrix',       'Easter egg 🐇'],
    ['hack',         'Easter egg 🔴'],
    ['sudo !!',      'Easter egg ☠️'],

  cmds.forEach(([c,d]) => {

function cmdPing(parts) {
  const host = parts[1] || 'localhost';
  print(`<span class="info-blue">PING ${escHtml(host)} 56(84) bytes of data.</span>`);
  const delays = [12, 14, 11, 13];
  let shown = 0;
  const iv = setInterval(() => {
    if (shown >= 4) {
      clearInterval(iv);
      printBlank();
      print(`<span class="info-blue">--- ${escHtml(host)} ping statistics ---</span>`);
      print(`<span class="info-blue">4 packets transmitted, 4 received, 0% packet loss</span>`);
      print(`<span class="info-blue">rtt min/avg/max = ${Math.min(...delays)}/${(delays.reduce((a,b)=>a+b,0)/4).toFixed(1)}/${Math.max(...delays)} ms</span>`);
      printBlank();
      return;
    }
    const ms = delays[shown] + (Math.random() * 2 - 1).toFixed(3);
    print(`<span class="info-blue">64 bytes from ${escHtml(host)}: icmp_seq=${shown+1} ttl=64 time=${ms} ms</span>`);
    shown++;
  }, 600);
}

// ═══════════════════════════════════════════════
function cmdMatrix() {
  const canvas = document.getElementById('matrix-canvas');
  canvas.style.display = 'block';
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  const ctx = canvas.getContext('2d');
  const cols = Math.floor(canvas.width / 16);
  const drops = Array(cols).fill(1);
  const chars = 'アイウエオカキクケコサシスセソタチツテトナニヌネノ0123456789ABCDEF><{}[]'.split('');

  print(`<span class="info-blue">Entering the Matrix... press any key to exit.</span>`);

  const iv = setInterval(() => {
    ctx.fillStyle = 'rgba(0,0,0,0.05)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#00ff41';
    ctx.font = '14px Share Tech Mono';
    drops.forEach((y, i) => {
      const ch = chars[Math.floor(Math.random() * chars.length)];
      ctx.fillText(ch, i * 16, y * 16);
      if (y * 16 > canvas.height && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    });
  }, 50);

  const stop = () => {
    clearInterval(iv);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    canvas.style.display = 'none';
    document.removeEventListener('keydown', stop);
    canvas.removeEventListener('click', stop);
    printBlank();
    print(`<span class="info-blue">Welcome back to reality, Neo.</span>`);
  };

  setTimeout(() => {
    document.addEventListener('keydown', stop, { once: true });
    canvas.addEventListener('click', stop, { once: true });
    canvas.style.pointerEvents = 'all';
  }, 500);
}
